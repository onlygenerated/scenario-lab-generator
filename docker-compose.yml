# Development: runs backend + frontend
# Usage: docker compose up
# Note: lab containers are spun up separately by the backend via python-on-whales

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./templates:/app/templates
      - ./demo:/app/demo
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount lab workspaces at the SAME absolute path on both host and container so
      # `docker compose --file <path>` (executed via the host daemon) can find files the
      # backend wrote from inside the container. LAB_BASE_DIR comes from .env.
      - ${LAB_BASE_DIR:-./lab_workspaces}:${LAB_BASE_DIR:-./lab_workspaces}
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend
